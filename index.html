<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Viewer</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Preload PDF.js library from CDN for rendering PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.338/pdf.min.js"></script>


</head>
<body>
    <header>
        <h1>Document Viewer</h1>
        <p class="subtitle">Explore the content with seamless navigation.</p>
    </header>
    <main>
        <div class="controls">
            <button id="prev-page" class="btn">Previous</button>
            <span id="page-num" class="page-info">Page: 1 of <span id="page-count"></span></span>
            <button id="next-page" class="btn">Next</button>
        </div>
        <div class="pdf-container">
            <canvas id="pdf-canvas"></canvas>
        </div>
    </main>
    <footer>
        <p>Powered by modern web technologies. Inspired by elegant design.</p>
    </footer>
    <script src="script.js"></script>

</body>
</html>
