<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>区块链圣经 · The Blockchain Bible</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "SF Pro Display", -apple-system, BlinkMacOSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #000;
      color: #f5f5f7;
      min-height: 100vh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 5vw;
    }

    header {
      padding: 12vh 0 10vh;
      text-align: center;
    }

    .title {
      font-size: clamp(3.5rem, 8vw, 9rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, #f5f5f7 30%, #a5a5af 70%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      margin-top: 1.2rem;
      font-size: clamp(1.3rem, 3vw, 2.1rem);
      font-weight: 300;
      color: #a1a1a6;
      opacity: 0.92;
    }

    .pdf-viewer-container {
      background: #161616;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 
        0 40px 80px -20px rgba(0,0,0,0.7),
        0 0 0 1px rgba(255,255,255,0.08) inset;
      margin-bottom: 12vh;
      position: relative;
      aspect-ratio: 1 / 1.414;
      max-height: 88vh;
    }

    .pdf-viewer-container iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #000;
    }

    .download-btn {
      position: absolute;
      bottom: 2.2rem;
      left: 50%;
      transform: translateX(-50%);
      padding: 0.9rem 2.4rem;
      font-size: 1.1rem;
      font-weight: 500;
      color: white;
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.28s cubic-bezier(0.25, 0.1, 0.25, 1);
      text-decoration: none;
      z-index: 10;
    }

    .download-btn:hover {
      background: rgba(255,255,255,0.22);
      transform: translateX(-50%) translateY(-2px);
    }

    footer {
      text-align: center;
      padding-bottom: 8vh;
      color: #6e6e73;
      font-size: 0.94rem;
    }

    @media (max-width: 768px) {
      header {
        padding: 16vh 0 8vh;
      }
      
      .pdf-viewer-container {
        border-radius: 18px;
        margin-bottom: 10vh;
      }
      
      .download-btn {
        bottom: 1.6rem;
        padding: 0.8rem 2rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1 class="title">区块链圣经</h1>
      <p class="subtitle">The Blockchain Bible</p>
    </header>

    <div class="pdf-viewer-container">
      <iframe 
        src="TheBlockchainBible.pdf#view=FitH"
        title="圣经 PDF 阅读器"
        allowfullscreen
      ></iframe>

      <!-- <a href="bible.pdf" download class="download-btn">
        下载完整 PDF
      </a> -->
    </div>

    <footer>
        © 2024-2026 TheBlockchainBible.com
    </footer>
  </div>

</body>
</html>
